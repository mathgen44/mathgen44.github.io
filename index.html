<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google-site-verification" content="yGKzbEdc2XiDYBNHd3CxhptPbFtzrTvkaB-MPah92x4" />
  <title>Mathgen</title>
  <link rel="icon" href="https://mathgen44.github.io/MyNote/icon.png">
  <style>
    :root { --accent: #0e7490; --bg: #fff; --text: #1f1f24; --muted: #5f6b70; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --accent: #5eead4; --bg: #1b1e20; --text: #ecebf0; --muted: #9fabb0; color-scheme: dark; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 "Segoe UI", system-ui, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
    a { color: var(--accent); }
    .app { display: flex; gap: 16px; align-items: center; margin-top: 24px; }
    .app img { width: 64px; height: 64px; }
    p { color: var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>Mathgen</h1>
  <p>Logiciels libres développés par Mathgen. / Open-source software by Mathgen.</p>
  <div class="app">
    <img src="https://mathgen44.github.io/MyNote/icon.png" alt="">
    <div>
      <a href="MyNote/"><b>MyNote</b></a><br>
      Prise de notes pour Windows, synchronisée avec Google Drive. / Note-taking for Windows, synced with Google Drive.
    </div>
  </div>
  <p><a href="https://github.com/mathgen44">github.com/mathgen44</a></p>
</main>
</body>
</html>
